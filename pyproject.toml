[project]
name = "ember-workspace"
version = "0.1.0"
description = "EMBER - Exploration Microgravity Burn Evaluation & Ranking (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = ["ember-data", "ember-backend"]

[tool.uv.workspace]
members = ["data_ml", "backend"]

[tool.uv.sources]
ember-data = { workspace = true }
ember-backend = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["backend", "data_ml"]
testpaths = ["data_ml/tests", "backend/tests"]
