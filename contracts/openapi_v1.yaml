openapi: 3.1.0
info:
  title: EMBER API
  version: 0.1.0
  description: |
    Contract between Squad 2 (backend/) and Squad 3 (frontend/).
    The frontend mock layer (NEXT_PUBLIC_API_MODE=mock) MUST return the same shapes.
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      summary: Service + data status
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/presets:
    get:
      summary: Mission cabin presets
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Preset" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/evaluate-cabin:
    post:
      summary: Baseline risk index + per-factor contributions for a cabin configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinConfig" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinEvaluation" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/experiments:
    get:
      summary: All test runs (schema_v1 records), optionally filtered
      parameters:
        - { name: program, in: query, required: false, schema: { anyOf: [{ $ref: "#/components/schemas/Program" }, { type: "null" }] } }
        - { name: fuel_material, in: query, required: false, schema: { anyOf: [{ $ref: "#/components/schemas/FuelMaterial" }, { type: "null" }] } }
        - { name: combustion_regime, in: query, required: false, schema: { anyOf: [{ $ref: "#/components/schemas/CombustionRegime" }, { type: "null" }] } }
        - name: gravity_g
          in: query
          required: false
          description: "Matched within ±0.01 g"
          schema: { anyOf: [{ type: number, minimum: 0, maximum: 1 }, { type: "null" }] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schema_v1.json" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/experiments/rank:
    post:
      summary: Scenario ranker - score test runs against a habitat configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RankRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankResponse" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/telemetry/{experiment_id}:
    get:
      summary: Time-series curves for one run
      parameters:
        - { name: experiment_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Telemetry" }
        "404": { description: Unknown experiment, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/documents:
    get:
      summary: All source documents and papers in the corpus
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentSummary" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/documents/{doc_id}:
    get:
      summary: Full multi-page content and metadata for one source document
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404": { description: Unknown document, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/copilot/ask:
    post:
      summary: Grounded RAG question answering (LangGraph)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: Upstream (LLM / retrieval) unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "504": { description: Upstream (LLM / retrieval) timed out, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

components:
  schemas:
    Program: { type: string, enum: [BASS-II, SoFIE, FLEX, ACME, Saffire] }
    FuelMaterial: { type: string, enum: [PMMA, Cotton-Fiberglass, Nomex, Heptane, Methanol] }
    DiluentGas: { type: string, enum: [N2, CO2, He, Ar] }
    CombustionRegime: { type: string, enum: [Sustained Burn, Self-Extinguished, Cool Flame, No Ignition] }
    EvidenceSource: { type: string, enum: [sql_tool, hybrid_retriever, scenario_ranker] }

    Health:
      type: object
      required: [status, db, test_runs, chunks, llm_provider]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: boolean }
        test_runs: { type: integer }
        chunks: { type: integer }
        llm_provider: { type: string }
        schema_version: { type: string, example: v1 }
        extra_telemetry_keys: { type: array, items: { type: string } }

    CabinConfig:
      type: object
      required: [oxygen_pct, pressure_kpa, flow_velocity_cm_s, gravity_g, fuel_material, diluent_gas]
      properties:
        oxygen_pct: { type: number }
        pressure_kpa: { type: number }
        flow_velocity_cm_s: { type: number }
        gravity_g: { type: number }
        fuel_material: { $ref: "#/components/schemas/FuelMaterial" }
        diluent_gas: { $ref: "#/components/schemas/DiluentGas" }

    Preset:
      allOf:
        - $ref: "#/components/schemas/CabinConfig"
        - type: object
          required: [id, name, description]
          properties:
            id: { type: string }
            name: { type: string }
            description: { type: string }

    Contribution:
      type: object
      required: [feature, label, value]
      properties:
        feature: { type: string }
        label: { type: string }
        value: { type: number, description: "Signed risk points; contributions sum to risk_index - baseline_risk" }

    CabinEvaluation:
      type: object
      required: [risk_index, risk_band, baseline_risk, predicted_regime, estimated_loi_pct, oxygen_margin_pct, contributions]
      properties:
        risk_index: { type: number, minimum: 0, maximum: 100 }
        risk_band: { type: string, enum: [LOW, ELEVATED, HIGH, CRITICAL] }
        baseline_risk: { type: number }
        predicted_regime: { $ref: "#/components/schemas/CombustionRegime" }
        estimated_loi_pct: { type: number }
        oxygen_margin_pct: { type: number, description: "oxygen_pct - estimated_loi_pct" }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/Contribution" }

    RankWeights:
      type: object
      properties:
        similarity: { type: number, default: 0.5 }
        completeness: { type: number, default: 0.2 }
        criticality: { type: number, default: 0.3 }

    RankRequest:
      type: object
      required: [config]
      properties:
        config: { $ref: "#/components/schemas/CabinConfig" }
        weights: { $ref: "#/components/schemas/RankWeights" }
        limit: { type: integer, default: 10 }

    RankedExperiment:
      type: object
      required: [rank, experiment_id, total_score, similarity, completeness, criticality, record]
      properties:
        rank: { type: integer }
        experiment_id: { type: string }
        total_score: { type: number }
        similarity: { type: number }
        completeness: { type: number }
        criticality: { type: number }
        record: { $ref: "schema_v1.json" }

    RankResponse:
      type: object
      required: [weights, results]
      properties:
        weights: { $ref: "#/components/schemas/RankWeights" }
        results:
          type: array
          items: { $ref: "#/components/schemas/RankedExperiment" }

    Telemetry:
      type: object
      required: [experiment_id, time_s, flame_radius_mm, radiative_heat_flux_kw_m2, flame_temp_k]
      properties:
        experiment_id: { type: string }
        time_s: { type: array, items: { type: number } }
        flame_radius_mm: { type: array, items: { type: number } }
        d_squared_mm2:
          type: ["array", "null"]
          items: { type: number }
        radiative_heat_flux_kw_m2: { type: array, items: { type: number } }
        flame_temp_k: { type: array, items: { type: number } }

    DocumentSection:
      type: object
      required: [section, text]
      properties:
        section: { type: string }
        text: { type: string }

    DocumentPage:
      type: object
      required: [page]
      properties:
        page: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/DocumentSection" }

    DocumentSummary:
      type: object
      required: [doc_id, title, source_type, page_count]
      properties:
        doc_id: { type: string }
        title: { type: string }
        source_type: { type: string }
        investigation: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        sources:
          type: array
          items: { type: string }
        page_count: { type: integer }

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          properties:
            pages:
              type: array
              items: { $ref: "#/components/schemas/DocumentPage" }
            related_experiment_ids:
              type: array
              items: { type: string }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        scenario: { anyOf: [{ $ref: "#/components/schemas/CabinConfig" }, { type: "null" }] }

    Citation:
      type: object
      required: [id, kind, snippet]
      properties:
        id: { type: string, description: "Label used inline in the answer, e.g. '[DOC-02 p.3]' or '[EXP-0012]'" }
        kind: { type: string, enum: [doc, experiment] }
        doc_id: { type: ["string", "null"] }
        page: { type: ["integer", "null"] }
        experiment_id: { type: ["string", "null"] }
        snippet: { type: string }

    Evidence:
      type: object
      required: [id, kind, source, score, text]
      properties:
        id: { type: string }
        kind: { type: string, enum: [chunk, test_run, ranked_run] }
        source: { $ref: "#/components/schemas/EvidenceSource", description: "Graph node that produced it" }
        score: { type: number }
        text: { type: string }
        doc_id: { type: ["string", "null"] }
        page: { type: ["integer", "null"] }
        experiment_id: { type: ["string", "null"] }

    AskResponse:
      type: object
      required: [answer, route, supported, rewrites, trace_id]
      properties:
        answer: { type: string }
        route: { type: string, enum: [facts, search, compare, out_of_scope] }
        supported: { type: boolean, description: "false when the graph answered 'no data'" }
        rewrites: { type: integer }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        dropped_claims: { type: array, items: { type: string }, description: "Sentences removed by citation_check" }
        trace_id: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "e.g. NOT_FOUND | VALIDATION_ERROR | UPSTREAM_UNAVAILABLE | INTERNAL_ERROR" }
            message: { type: string }
            details:
              type: ["object", "array", "null"]
              description: "Optional extra context (e.g. validation error list); null when absent"
