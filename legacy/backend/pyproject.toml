[project]
name = "ember-backend"
version = "0.1.0"
description = "EMBER Squad 2 - FastAPI + LangGraph grounded RAG"
requires-python = ">=3.11"
dependencies = [
  "ember-data",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "google-genai>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
tracing = ["langsmith>=0.1"]
# TODO(squad2): RAGAS evaluation
eval = ["ragas>=0.2"]

[tool.uv.sources]
ember-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
