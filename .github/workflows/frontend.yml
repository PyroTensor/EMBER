name: frontend

on:
  push:
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Generated API types match the contract
        run: |
          cp src/lib/api/schema.d.ts /tmp/schema.before.d.ts
          npx prettier --write /tmp/schema.before.d.ts
          npm run gen:api
          git show HEAD:frontend/src/lib/api/schema.d.ts \
            | npx prettier --parser typescript > /tmp/schema.tracked.d.ts
          npx prettier --parser typescript src/lib/api/schema.d.ts > /tmp/schema.generated.d.ts
          diff -u /tmp/schema.tracked.d.ts /tmp/schema.generated.d.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
