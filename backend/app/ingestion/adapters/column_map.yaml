# Column mapping: source header -> schema_v1 field (+ unit conversion).
# THIS IS THE FILE YOU EDIT ON NOV 14.
#
# For each canonical field, list every header spelling we might see. Matching is
# case-insensitive and ignores surrounding whitespace. `unit` triggers a conversion in
# normalize.py (UNIT_CONVERTERS). Any header NOT listed here goes into extra_telemetry.

fields:
  experiment_id:
    - { column: experiment_id }
    - { column: "Run ID" }
    - { column: run_id }
    - { column: "Test ID" }
    - { column: test_id }
    - { column: "Experiment ID" }
    - { column: "Point ID" }
  program:
    - { column: program }
    - { column: Investigation }
    - { column: experiment }
    - { column: Mission }
    - { column: "PSI ID" }
    - { column: psi_id }
  fuel_material:
    - { column: fuel_material }
    - { column: Sample }
    - { column: material }
    - { column: fuel }
    - { column: "Fuel Material" }
    - { column: "Sample Material" }
  fuel_geometry:
    - { column: fuel_geometry }
    - { column: Config }
    - { column: geometry }
    - { column: "Fuel Geometry" }
    - { column: "Sample Geometry" }
    - { column: Configuration }
  gravity_g:
    - { column: gravity_g, unit: g }
    - { column: g_level, unit: g }
    - { column: gravity, unit: g }
    - { column: "Gravity (g)", unit: g }
    - { column: "Gravity Level", unit: g }
  oxygen_pct:
    - { column: oxygen_pct, unit: pct }
    - { column: "O2 (%)", unit: pct }
    - { column: "Oxygen (%)", unit: pct }
    - { column: "Ambient O2 (%)", unit: pct }
    - { column: "O2 (frac)", unit: fraction }
    - { column: "Oxygen Mole Fraction", unit: fraction }
    - { column: x_o2, unit: fraction }
  pressure_kpa:
    - { column: pressure_kpa, unit: kpa }
    - { column: "Pressure (kPa)", unit: kpa }
    - { column: "Ambient Pressure (kPa)", unit: kpa }
    - { column: "Cabin Pressure (kPa)", unit: kpa }
    - { column: "Pressure (psia)", unit: psia }
    - { column: "Ambient Pressure (psia)", unit: psia }
    - { column: "Pressure (atm)", unit: atm }
    - { column: "Ambient Pressure (atm)", unit: atm }
  flow_velocity_cm_s:
    - { column: flow_velocity_cm_s, unit: cm_s }
    - { column: "Flow (cm/s)", unit: cm_s }
    - { column: "Forced Flow (cm/s)", unit: cm_s }
    - { column: "Flow Velocity (cm/s)", unit: cm_s }
    - { column: "Air Velocity (cm/s)", unit: cm_s }
    - { column: "Flow (ft/min)", unit: ft_min }
    - { column: "Flow (mm/s)", unit: mm_s }
    - { column: "Flow Velocity (mm/s)", unit: mm_s }
    - { column: "Forced Flow (mm/s)", unit: mm_s }
  diluent_gas:
    - { column: diluent_gas }
    - { column: Diluent }
    - { column: "Diluent Gas" }
    - { column: "Balance Gas" }
    - { column: Inert }
  combustion_regime:
    - { column: combustion_regime, unit: regime }
    - { column: Outcome, unit: regime }
    - { column: result, unit: regime }
    - { column: Regime, unit: regime }
    - { column: "Combustion Regime", unit: regime }
  spread_or_burn_rate:
    - { column: spread_or_burn_rate }
    - { column: "Spread/Burn rate" }
    - { column: "Spread Rate (cm/s)", unit: cm_s }
    - { column: "Flame Spread Rate (cm/s)", unit: cm_s }
    - { column: "Spread Rate (mm/s)", unit: mm_s }
    - { column: "Flame Spread Rate (mm/s)", unit: mm_s }
    - { column: "Burn Rate (mm2/s)" }
    - { column: "Burning Rate (mm2/s)" }
    - { column: "Burning Rate Constant (mm2/s)" }
    - { column: "K (mm2/s)" }
  peak_radiative_flux_kw_m2:
    - { column: peak_radiative_flux_kw_m2, unit: kw_m2 }
    - { column: "Peak Heat Flux (kW/m2)", unit: kw_m2 }
    - { column: "Peak Rad Flux (kW/m2)", unit: kw_m2 }
    - { column: "Peak Rad Flux (W/cm2)", unit: w_cm2 }
    - { column: "Peak Heat Flux (W/cm2)", unit: w_cm2 }
  limiting_oxygen_index_pct:
    - { column: limiting_oxygen_index_pct, unit: pct }
    - { column: LOI, unit: pct }
    - { column: "LOI (%)", unit: pct }
    - { column: "Limiting Oxygen Index (%)", unit: pct }
  burn_duration_s:
    - { column: burn_duration_s }
    - { column: "Duration [s]" }
    - { column: "Burn Duration (s)" }
    - { column: "Flame Duration (s)" }
    - { column: "Duration (s)" }
  source_doc_id:
    - { column: source_doc_id }
  source_page:
    - { column: source_page, unit: int }
  extra_telemetry:
    - { column: extra_telemetry, unit: json }

