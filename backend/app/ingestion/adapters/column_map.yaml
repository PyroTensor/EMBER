# Column mapping: source header -> schema_v1 field (+ unit conversion).
# THIS IS THE FILE YOU EDIT ON NOV 14.
#
# For each canonical field, list every header spelling we might see. Matching is
# case-insensitive and ignores surrounding whitespace. `unit` triggers a conversion in
# normalize.py (UNIT_CONVERTERS). Any header NOT listed here goes into extra_telemetry.

fields:
  experiment_id:
    - { column: experiment_id }
    - { column: "Run ID" }
    - { column: run_id }
    - { column: "Test ID" }
  program:
    - { column: program }
    - { column: Investigation }
    - { column: experiment }
  fuel_material:
    - { column: fuel_material }
    - { column: Sample }
    - { column: material }
    - { column: fuel }
  fuel_geometry:
    - { column: fuel_geometry }
    - { column: Config }
    - { column: geometry }
  gravity_g:
    - { column: gravity_g, unit: g }
    - { column: g_level, unit: g }
    - { column: gravity, unit: g }
  oxygen_pct:
    - { column: oxygen_pct, unit: pct }
    - { column: "O2 (%)", unit: pct }
    - { column: "O2 (frac)", unit: fraction }
    - { column: x_o2, unit: fraction }
  pressure_kpa:
    - { column: pressure_kpa, unit: kpa }
    - { column: "Pressure (kPa)", unit: kpa }
    - { column: "Pressure (psia)", unit: psia }
    - { column: "Pressure (atm)", unit: atm }
  flow_velocity_cm_s:
    - { column: flow_velocity_cm_s, unit: cm_s }
    - { column: "Flow (cm/s)", unit: cm_s }
    - { column: "Flow (ft/min)", unit: ft_min }
    - { column: "Flow (mm/s)", unit: mm_s }
  diluent_gas:
    - { column: diluent_gas }
    - { column: Diluent }
  combustion_regime:
    - { column: combustion_regime, unit: regime }
    - { column: Outcome, unit: regime }
    - { column: result, unit: regime }
  spread_or_burn_rate:
    - { column: spread_or_burn_rate }
    - { column: "Spread/Burn rate" }
  peak_radiative_flux_kw_m2:
    - { column: peak_radiative_flux_kw_m2, unit: kw_m2 }
    - { column: "Peak Rad Flux (W/cm2)", unit: w_cm2 }
  limiting_oxygen_index_pct:
    - { column: limiting_oxygen_index_pct, unit: pct }
    - { column: LOI, unit: pct }
  burn_duration_s:
    - { column: burn_duration_s }
    - { column: "Duration [s]" }
  source_doc_id:
    - { column: source_doc_id }
  source_page:
    - { column: source_page, unit: int }
  extra_telemetry:
    - { column: extra_telemetry, unit: json }

# Free-text values -> schema enums
aliases:
  program:
    "BASS": BASS-II
    "BASS 2": BASS-II
    "SPICE": BASS-II
    "SLICE": BASS-II
    "Saffire": SoFIE
    "Saffire-I": SoFIE
    "Saffire-II": SoFIE
    "Saffire-III": SoFIE
    "LUCI": SoFIE
    "FM2": SoFIE
    "FLEX-2": FLEX
    "CFI": FLEX
    "BRE": ACME
    "CFI-G": ACME
    "E-FIELD": ACME
    "E-FIELD Flames": ACME
    "SAME": ACME
    "SAME-R": ACME
    "DAFT": ACME
    "DAFT-2": ACME
  fuel_material:
    "SIBAL": Cotton-Fiberglass
    "cotton/fiberglass": Cotton-Fiberglass
    "n-heptane": Heptane
    "plexiglas": PMMA
  fuel_geometry:
    "sheet": Flat Sheet
    "flat": Flat Sheet
    "cylinder": Rod
  combustion_regime:
    "burned": Sustained Burn
    "burn": Sustained Burn
    "sustained": Sustained Burn
    "extinguished": Self-Extinguished
    "ext": Self-Extinguished
    "self-ext": Self-Extinguished
    "cool flame": Cool Flame
    "cf": Cool Flame
    "no ign": No Ignition
    "ni": No Ignition
    "no ignition": No Ignition
